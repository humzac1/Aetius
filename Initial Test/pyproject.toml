[project]
name = "caligula"
version = "0.1.0"
description = "Agent security assurance: reconstructs a structural twin of a real agent system from Langfuse or Braintrust traces and runs a statistically sound attack/regression engine against it."
requires-python = ">=3.11"
dependencies = [
    "agno==2.6.17",
    "anthropic==0.109.2",
    "pydantic==2.13.4",
    "pyyaml==6.0.2",
    "python-dotenv==1.1.1",
    "platformdirs==4.11.0",
    # Part 3 (stats).
    "numpy==2.3.4",
    "pandas==2.3.3",
    "scipy==1.16.3",
    "statsmodels==0.14.5",
    # Part 6 (tui, the shipped `caligula` command).
    "textual==8.2.8",
    # Ingestion (real trace-source project reconstruction, see ingestion/).
    "langfuse==4.14.2",
    "braintrust==0.32.0",
]

[project.optional-dependencies]
# dashboard/app.py only — nothing the `caligula` command itself reaches
# imports streamlit/plotly (confirmed by grep), so this stays out of the
# base install. It matters in practice: streamlit pulls in pyarrow, which
# has no prebuilt wheel yet for newer Python versions (e.g. 3.14 at the
# time this was split out) and fails to build from source without cmake
# installed -- that broke a plain `pipx install` on a default/newer
# python3 even though the base package needs none of it.
dashboard = [
    "streamlit==1.51.0",
    "plotly==6.3.1",
]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
]

[project.scripts]
caligula = "tui.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["target_system", "attacker", "stats", "experiments", "dashboard", "tui", "ingestion", "config"]
